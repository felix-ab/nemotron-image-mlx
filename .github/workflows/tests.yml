name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-latest  # Apple Silicon runner; no Metal GPU in CI, so the tests avoid GPU-only kernels
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[test]"
      - run: uv run pytest -q
