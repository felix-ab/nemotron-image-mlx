name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-14  # Apple Silicon; no Metal GPU in CI, so GPU-only kernels are skipped
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[test]"
      - run: uv run pytest -q
